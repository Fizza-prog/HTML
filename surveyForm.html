<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">Survey Form</h1>
    
    <p id="description">Please fill out this survey to help us improve our services</p>
    
    <form id="survey-form">
      <div>
        <label id="name-label">Name:</label>
        <input id="name" type="text" placeholder="Enter your name" required>
      </div>
      
      <div>
        <label id="email-label">Email:</label>
        <input id="email" type="email" placeholder="Enter your email" required>
      </div>
      
      <div>
        <label id="number-label">Age:</label>
        <input id="number" type="number" min="1" max="120" placeholder="Enter your age">
      </div>
      
      <div>
        <label>How did you hear about us?</label>
        <select id="dropdown">
          <option value="social-media">Social Media</option>
          <option value="friend">Friend or Family</option>
          <option value="advertisement">Advertisement</option>
          <option value="other">Other</option>
        </select>
      </div>
      
      <div>
        <label>Would you recommend our service?</label><br>
        <input type="radio" name="recommend" value="definitely"> Definitely<br>
        <input type="radio" name="recommend" value="maybe"> Maybe<br>
        <input type="radio" name="recommend" value="not-sure"> Not sure
      </div>
      
      <div>
        <label>What would you like to see improved? (Check all that apply)</label><br>
        <input type="checkbox" value="front-end"> Front-end Projects<br>
        <input type="checkbox" value="back-end"> Back-end Projects<br>
        <input type="checkbox" value="data-visualization"> Data Visualization<br>
        <input type="checkbox" value="challenges"> Challenges<br>
        <input type="checkbox" value="open-source"> Open Source Community
      </div>
      
      <div>
        <label>Additional comments:</label><br>
        <textarea rows="4" cols="50" placeholder="Enter your comments here..."></textarea>
      </div>
      
      <div>
        <button id="submit" type="submit">Submit</button>
      </div>
    </form>
  </body>
</html>
